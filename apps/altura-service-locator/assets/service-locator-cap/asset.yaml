apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: service-locator-cap
  version: 1.0.0

type: cap-app

provides:
  protocols:
    - odata-v4
    - rest
  service:
    protocol: odata-v4
    endpoints:
      - name: service-locator
        path: /service-locator

database:
  type: sqlite

components:
  - name: srv
    buildPath: .
    port: 4004
    provides:
      endpoints:
        - path: /odata/v4
          port: 4004
          protocol: http
      protocols:
        - odata-v4
        - rest

probes:
  startup:
    path: /health
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
