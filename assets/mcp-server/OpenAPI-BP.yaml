openapi: 3.0.0
info:
  title: Business Partner (A2X)
  version: 1.7.0
  description: >-
    This service enables you to create, display, update, and delete data related
    to Business Partner, Supplier, and Customer with the data provided in a
    payload, in an API call. This service also supports create deep entity
    operation and batch processing.
externalDocs:
  description: Business Documentation
  url: >-
    https://help.sap.com/http.svc/ahp2/SAP_S4HANA_CLOUD/2602.latest/EN/85/043858ea0f9244e10000000a4450e5/frameset.htm
x-sap-api-type: ODATA
x-sap-shortText: >-
  Create, read, update or delete the master data for business partner, supplier
  or customer using this synchronous inbound service
x-sap-software-min-version: '2602'
x-sap-ext-overview:
  - name: Communication Scenario
    values:
      - text: 'Business Partner, Customer and Supplier Integration (SAP_COM_0008)'
        format: plain
      - text: SAP Analytics Cloud for Planning Integration (SAP_COM_0087)
        format: plain
      - text: SAP Real Estate Contract API Integration (SAP_COM_0393)
        format: plain
      - text: Excise Tax Integration (SAP_COM_0568)
        format: plain
      - text: >-
          Procurement - Supplier Quotation Management Integration (Deprecated)
          (SAP_COM_0760)
        format: plain
      - text: >-
          Resource Management in SAP Project and Resource Management - API
          Integration (SAP_COM_0A11)
        format: plain
      - text: >-
          Agent and Tool Integration Layer for SAPSCORE Integration
          (SAP_COM_1294)
        format: plain
  - name: Scope Items
    values:
      - text: >-
          [Master Data Integration
          (1RO)](https://me.sap.com/processnavigator/SolP/1RO " Link To BP ")
        format: markdown
      - text: >-
          [Invoice Processing with SAP Ariba Central Invoice Management
          (4N6)](https://me.sap.com/processnavigator/SolP/4N6 " Link To BP ")
        format: markdown
      - text: >-
          [Standalone Manual Transportation Planning
          (6W5)](https://me.sap.com/processnavigator/SolP/6W5 " Link To BP ")
        format: markdown
      - text: >-
          [Import Connection Setup with SAP Analytics Cloud
          (1YB)](https://me.sap.com/processnavigator/SolP/1YB " Link To BP ")
        format: markdown
      - text: >-
          [Lease-Out Accounting
          (O1Q)](https://me.sap.com/processnavigator/SolP/O1Q " Link To BP ")
        format: markdown
      - text: >-
          [Lease-In Accounting
          (OT6)](https://me.sap.com/processnavigator/SolP/OT6 " Link To BP ")
        format: markdown
      - text: >-
          [Lease-In Accounting
          (1T6)](https://me.sap.com/processnavigator/SolP/1T6 " Link To BP ")
        format: markdown
      - text: >-
          [Lease-Out Accounting
          (21Q)](https://me.sap.com/processnavigator/SolP/21Q " Link To BP ")
        format: markdown
      - text: >-
          [Service Contract (21R)](https://me.sap.com/processnavigator/SolP/21R
          " Link To BP ")
        format: markdown
      - text: >-
          [Service Contract (O1R)](https://me.sap.com/processnavigator/SolP/O1R
          " Link To BP ")
        format: markdown
      - text: >-
          [Integration of SAP S/4HANA and SAP Cloud for Real Estate
          (4X3)](https://me.sap.com/processnavigator/SolP/4X3 " Link To BP ")
        format: markdown
      - text: >-
          [Enablement of SAP Excise Tax Management
          (4LO)](https://me.sap.com/processnavigator/SolP/4LO " Link To BP ")
        format: markdown
      - text: >-
          [Direct Material Sourcing
          (4RD)](https://me.sap.com/processnavigator/SolP/4RD " Link To BP ")
        format: markdown
      - text: >-
          [Resource Management for Projects
          (6JO)](https://me.sap.com/processnavigator/SolP/6JO " Link To BP ")
        format: markdown
  - name: Authentication Methods
    values:
      - text: x509
        format: plain
  - name: Business Object
    values:
      - text: Business Partner
        format: plain
x-sap-extensible:
  supported: manual
  description: "If you are working with key user extensibility, the API can be extended by custom fields on the following business contexts (field usage for this API needs to be selected):\r\n* Master Data: Business Partner (BP_CUSTVEND1)\r\n* Customer Core View (CUSTOMER_GENERAL)\r\n* Customer company code core (CUST_COMPANYCODE)\r\n* Partner Sales area core view (CUST_SALES)\r\n* Supplier Core View (SUPPLIER_GENERAL)\r\n* Supplier Company Code Core (SUP_COMPANYCODE)\r\n* Supplier Purchasing Org Core (SUP_PURORG)\r\n\r\n[How to add an extension field to an API](https://help.sap.com/docs/SAP_S4HANA_CLOUD/0f69f8fb28ac4bf48d2b57b9637e81fa/ce819b8557194ae0aa180ba4ac6a04de.html)"
servers:
  - url: 'https://{host}:{port}/sap/opu/odata/sap/API_BUSINESS_PARTNER'
    variables:
      host:
        default: ''
      port:
        default: ''
  - url: >-
      https://sandbox.api.sap.com/s4hanacloud/sap/opu/odata/sap/API_BUSINESS_PARTNER
security:
  - OAuth2Auth:
      - API_BUSINESS_PARTNER_0001
  - BasicAuth: []
tags:
  - name: Business Partner
paths:
  '/A_BusinessPartner(''{BusinessPartner}'')':
    parameters:
      - name: BusinessPartner
        in: path
        required: true
        description: Business Partner Number
        schema:
          type: string
          maxLength: 10
    get:
      summary: Retrieves business partner data by using business partner number.
      description: >-
        Retrieves the general data fields of the business partner record by
        using business partner number.
      tags:
        - Business Partner
      responses:
        '200':
          description: Retrieved entity
          content:
            application/json:
              schema:
                title: A_BusinessPartnerType
                type: object
                properties:
                  d:
                    $ref: >-
                      #/components/schemas/API_BUSINESS_PARTNER.A_BusinessPartnerType
        4XX:
          $ref: '#/components/responses/error'
    patch:
      summary: Updates business partner general data.
      description: Updates business partner general data by using business partner number.
      tags:
        - Business Partner
      requestBody:
        required: true
        description: New property values
        content:
          application/json:
            schema:
              title: Modified A_BusinessPartnerType
              type: object
              properties:
                d:
                  $ref: >-
                    #/components/schemas/API_BUSINESS_PARTNER.A_BusinessPartnerType-update
      responses:
        '204':
          description: Success
        4XX:
          $ref: '#/components/responses/error'
