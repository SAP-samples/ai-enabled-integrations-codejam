<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="300" height="100">
  <!-- Logo 2: The Machine — minimal espresso machine silhouette + stacked wordmark -->

  <g transform="translate(12, 8)">
    <!-- Machine body -->
    <rect x="8" y="28" width="64" height="42" rx="3" ry="3" fill="#2c1a0e"/>
    <!-- Machine top panel / group head area -->
    <rect x="4" y="22" width="72" height="12" rx="2" ry="2" fill="#2c1a0e"/>
    <!-- Front panel highlight strip -->
    <rect x="14" y="36" width="52" height="3" rx="1" fill="#7a5c3a"/>
    <!-- Display/badge circle -->
    <circle cx="25" cy="50" r="8" fill="none" stroke="#7a5c3a" stroke-width="1.5"/>
    <circle cx="25" cy="50" r="4" fill="#7a5c3a"/>
    <!-- Group head portafilter spouts -->
    <rect x="50" y="62" width="6" height="8" rx="1" fill="#7a5c3a"/>
    <!-- Drip tray -->
    <rect x="4" y="70" width="72" height="6" rx="2" fill="#7a5c3a"/>
    <rect x="10" y="72" width="60" height="2" rx="1" fill="#c4b9ad" opacity="0.5"/>
    <!-- Steam wand arm -->
    <line x1="72" y1="30" x2="82" y2="30" stroke="#2c1a0e" stroke-width="3" stroke-linecap="round"/>
    <line x1="82" y1="30" x2="82" y2="54" stroke="#2c1a0e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="82" cy="56" r="3" fill="#7a5c3a"/>
    <!-- Steam puffs from wand -->
    <path d="M80,22 Q77,16 80,10 Q83,4 80,-2" fill="none" stroke="#c4b9ad" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M84,20 Q81,14 84,8 Q87,2 84,-4" fill="none" stroke="#c4b9ad" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <!-- Knobs -->
    <circle cx="44" cy="45" r="5" fill="none" stroke="#c4b9ad" stroke-width="1.5"/>
    <line x1="44" y1="40" x2="44" y2="43" stroke="#c4b9ad" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark stacked right -->
  <text x="192" y="40" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#2c1a0e" text-anchor="middle">ALTURA</text>
  <!-- Divider -->
  <line x1="152" y1="48" x2="232" y2="48" stroke="#c4b9ad" stroke-width="0.6"/>
  <text x="192" y="60" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" font-weight="300" letter-spacing="3.5" fill="#7a5c3a" text-anchor="middle">COFFEE CO.</text>
  <text x="192" y="74" font-family="'Helvetica Neue', Arial, sans-serif" font-size="5.5" font-weight="300" letter-spacing="2" fill="#c4b9ad" text-anchor="middle">COMMERCIAL · INDUSTRIAL</text>
</svg>
