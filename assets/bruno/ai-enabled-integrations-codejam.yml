          seq: 7
        http:
          method: GET
          url: https://altura-service-locator.cfapps.eu20-002.hana.ondemand.com/service-locator/ServiceCenters
          auth:
            type: basic
            username: '{{SCL.username}}'
            password: '{{SCL.password}}'
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
bundled: true
extensions:
